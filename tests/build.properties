# fhir-frog build properties for the PH eReferral end-to-end tests
# Override on the command line: ant -Dimage.tag=my-image:1.0

# Docker image name for the committed HAPI snapshot
# Change this to match your IG version and environment
image.tag=hapi-ph-ereferral:0.1.0

# Path to the fhir-frog Ant task fat JAR (classifier: all)
# Run 'ant fetch-jar' to download automatically, or point to your local build:
#   fhir.frog.jar=/path/to/fhir-frog/fhir-frog-ant/target/fhir-frog-ant-VERSION-all.jar
fhir.frog.jar=${user.home}/.fhir-frog/lib/fhir-frog-ant-${fhir.frog.version}-all.jar

# fhir-frog version — update when upgrading the tool
fhir.frog.version=0.1.1-main-SNAPSHOT

# Release URL for the fhir-frog fat JAR — used by the fetch-jar target.
# Override on the command line: ant -Dfhir.frog.release.url=https://...
# Update the URL below when a new version is published to GitHub Releases.
# TODO: update once fhir-frog publishes a release to GitLab Packages or a download URL is confirmed
fhir.frog.release.url=https://gitlab.com/australian-e-health-research-centre/fhir-frog/-/releases/permalink/latest/downloads/fhir-frog-ant-all.jar

# Path to the fhir-frog-mbt fat JAR used by the generate target.
# Built by: mvn install -pl fhir-frog-mbt -am -DskipTests inside the fhir-frog repo.
# The -all classifier produces a fat JAR with all dependencies bundled.
# TODO: update this path / version once fhir-frog-mbt publishes a release artifact.
fhir.frog.mbt.jar=${user.home}/.m2/repository/au/csiro/fhir/fhir-frog-mbt/0-SNAPSHOT/fhir-frog-mbt-0-SNAPSHOT.jar

# FHIR server URL used by the test target (must match docker-compose port mapping)
server.url=http://localhost:8080/fhir

# Docker Compose file path (generated by the init target)
compose.file=.fhir-frog/docker-compose.yml

# Sushi config — read by fhirinit and cache-packages targets
sushi.config=../sushi-config.yaml

# Paths relative to the tests/ directory
fixtures.dir=fixtures
generated.json.dir=generated/json
generated.tsh.dir=generated/tsh
state.machine.yaml=state-model/referral-workflow-state-machine.yaml

# Directory for Surefire XML output
junit.xml.dir=test-reports/xml

# Directory for junitreport HTML output
report.dir=test-reports/html
